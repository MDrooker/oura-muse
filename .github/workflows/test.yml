name: tests

on:
  push:
  pull_request:

jobs:
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: compile check
        run: python3 -m py_compile bin/oura bin/oura_lib.py tests/test_sandbox.py
      - name: live sandbox tests (no credentials needed)
        run: python3 tests/test_sandbox.py
      - name: CLI smoke test
        run: ./bin/oura --sandbox readiness --start 2026-10-01 --end 2026-10-02 | head -5
